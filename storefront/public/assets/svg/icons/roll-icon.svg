<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Rulo etiket — yan profil silindir + etiket bandı</title>

  <!-- Sefa 18 May v68: roll-icon yeniden çizildi (eski versiyon "hatalı"
       feedback'i sonrası). 64×64 viewBox ile sheet-icon ile parity.
       Yan profil silindir + sağ uç kesit (perspektif) + alttan çıkan
       etiket bandı (kontur kesim ipucu). -->

  <!-- Roll cylinder body (yatık silindir gövde) -->
  <rect x="10" y="18" width="42" height="22" rx="11" stroke="#1F1B2D" stroke-width="2" fill="#FAFAF4"/>

  <!-- Sağ uç ellipse (perspektif — rulonun açık ucu görünür) -->
  <ellipse cx="48" cy="29" rx="4" ry="11" stroke="#1F1B2D" stroke-width="2" fill="#FFFFFF"/>

  <!-- Core hole (göbek deliği) sağ uçta -->
  <ellipse cx="48" cy="29" rx="1.5" ry="4" fill="#1F1B2D" opacity="0.28"/>

  <!-- Üst highlight (silindir parlama) -->
  <rect x="16" y="20.5" width="18" height="1.8" rx="0.9" fill="#FFFFFF" opacity="0.6"/>

  <!-- Etiket bandı — rulodan çıkan flap (kontur kesim ipucu, mercan dashed) -->
  <rect x="22" y="42" width="13" height="13" rx="1.5"
        stroke="#ef3e56" stroke-width="1.6"
        fill="#FFFFFF" stroke-dasharray="2.5 1.6"/>
</svg>
