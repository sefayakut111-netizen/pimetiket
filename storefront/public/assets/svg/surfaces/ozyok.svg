<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <defs>
    <clipPath id="surface-clip">
      <rect x="0" y="0" width="220" height="110" rx="35" ry="35"></rect>
    </clipPath>
  </defs>
  <g clip-path="url(#surface-clip)">
<defs>
          <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F5F0E2"></stop>
            <stop offset="100%" stop-color="#E3DAC2"></stop>
          </linearGradient>
          
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#9C8C6E" stroke-opacity="0.18" stroke-width="1"></line>
          </pattern>
          <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1">
            <stop offset="65%" stop-color="#3A2E18" stop-opacity="0"></stop>
            <stop offset="100%" stop-color="#3A2E18" stop-opacity="0.12"></stop>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#base)"></rect>
        <rect width="100%" height="100%" fill="url(#hatch)"></rect>
        <rect width="100%" height="100%" fill="url(#bot)"></rect>
  </g>
</svg>