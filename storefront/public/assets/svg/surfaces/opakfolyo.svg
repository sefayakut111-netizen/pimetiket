<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <defs>
    <clipPath id="surface-clip">
      <rect x="0" y="0" width="220" height="110" rx="35" ry="35"></rect>
    </clipPath>
  </defs>
  <g clip-path="url(#surface-clip)">
<defs>
          <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FDFDFE"></stop>
            <stop offset="55%" stop-color="#F1F2F4"></stop>
            <stop offset="100%" stop-color="#E2E4E8"></stop>
          </linearGradient>
          <radialGradient id="key" cx="28%" cy="22%" r="65%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"></stop>
            <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </radialGradient>
          
          <filter id="tex">
            <feTurbulence type="fractalNoise" baseFrequency="2.0" numOctaves="2" seed="2"></feTurbulence>
            <feColorMatrix values="0 0 0 0 0.7  0 0 0 0 0.7  0 0 0 0 0.75  0 0 0 0.15 0"></feColorMatrix>
            <feComposite in2="SourceGraphic" operator="in"></feComposite>
          </filter>
          <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1">
            <stop offset="70%" stop-color="#0A0E16" stop-opacity="0"></stop>
            <stop offset="100%" stop-color="#0A0E16" stop-opacity="0.10"></stop>
          </linearGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"></stop>
            <stop offset="3%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#base)"></rect>
        <rect width="100%" height="100%" filter="url(#tex)" opacity="0.4"></rect>
        <rect width="100%" height="100%" fill="url(#key)"></rect>
        <rect width="100%" height="100%" fill="url(#bot)"></rect>
        <rect width="100%" height="100%" fill="url(#rim)"></rect>
  </g>
</svg>