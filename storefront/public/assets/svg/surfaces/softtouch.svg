<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <defs>
    <clipPath id="surface-clip">
      <rect x="0" y="0" width="220" height="110" rx="35" ry="35"></rect>
    </clipPath>
  </defs>
  <g clip-path="url(#surface-clip)">
<defs>
          <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5C544A"></stop>
            <stop offset="55%" stop-color="#473F36"></stop>
            <stop offset="100%" stop-color="#322B24"></stop>
          </linearGradient>
          
          <filter id="velvet">
            <feTurbulence type="fractalNoise" baseFrequency="2.6" numOctaves="2" seed="11"></feTurbulence>
            <feColorMatrix values="0 0 0 0 0.92  0 0 0 0 0.88  0 0 0 0 0.78  0 0 0 0.28 0"></feColorMatrix>
            <feComposite in2="SourceGraphic" operator="in"></feComposite>
          </filter>
          
          <radialGradient id="key" cx="30%" cy="22%" r="80%">
            <stop offset="0%" stop-color="#A88E68" stop-opacity="0.30"></stop>
            <stop offset="100%" stop-color="#A88E68" stop-opacity="0"></stop>
          </radialGradient>
          <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1">
            <stop offset="65%" stop-color="#000" stop-opacity="0"></stop>
            <stop offset="100%" stop-color="#000" stop-opacity="0.30"></stop>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#base)"></rect>
        <rect width="100%" height="100%" filter="url(#velvet)" opacity="0.85"></rect>
        <rect width="100%" height="100%" fill="url(#key)"></rect>
        <rect width="100%" height="100%" fill="url(#bot)"></rect>
  </g>
</svg>