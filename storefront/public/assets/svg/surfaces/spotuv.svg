<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <defs>
    <clipPath id="surface-clip">
      <rect x="0" y="0" width="220" height="110" rx="35" ry="35"></rect>
    </clipPath>
  </defs>
  <g clip-path="url(#surface-clip)">
<defs>
          
          <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F4EEDF"></stop>
            <stop offset="100%" stop-color="#E2D8BF"></stop>
          </linearGradient>
          <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="9"></feTurbulence>
            <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.22  0 0 0 0.32 0"></feColorMatrix>
            <feComposite in2="SourceGraphic" operator="in"></feComposite>
          </filter>
          
          <radialGradient id="uv-fill" cx="35%" cy="35%" r="75%">
            <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.85"></stop>
            <stop offset="100%" stop-color="#FFFDF5" stop-opacity="0.18"></stop>
          </radialGradient>
          
          <linearGradient id="uv-shine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0"></stop>
            <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.85"></stop>
            <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.85"></stop>
            <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </linearGradient>
          
          <linearGradient id="uv-edge" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"></stop>
            <stop offset="100%" stop-color="#5A4A28" stop-opacity="0.15"></stop>
          </linearGradient>
        </defs>
        
        <rect width="100%" height="100%" fill="url(#base)"></rect>
        <rect width="100%" height="100%" filter="url(#grain)" opacity="0.55"></rect>
        
        <g>
          <rect x="18%" y="24%" width="64%" height="52%" rx="6" ry="6" fill="url(#uv-fill)" stroke="url(#uv-edge)" stroke-width="0.8"></rect>
          <rect x="18%" y="24%" width="64%" height="52%" rx="6" ry="6" fill="url(#uv-shine)"></rect>
        </g>
  </g>
</svg>