<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <defs>
    <clipPath id="surface-clip">
      <rect x="0" y="0" width="220" height="110" rx="35" ry="35"></rect>
    </clipPath>
  </defs>
  <g clip-path="url(#surface-clip)">
<defs>
          
          <linearGradient id="iri1" x1="0" y1="0" x2="1" y2="1.1">
            <stop offset="0%" stop-color="#FFA8D2"></stop>
            <stop offset="14%" stop-color="#FF8EBE"></stop>
            <stop offset="28%" stop-color="#9CDCFF"></stop>
            <stop offset="42%" stop-color="#B6F4CA"></stop>
            <stop offset="56%" stop-color="#FFE894"></stop>
            <stop offset="70%" stop-color="#D4ADFF"></stop>
            <stop offset="84%" stop-color="#A8D4FF"></stop>
            <stop offset="100%" stop-color="#FFA8D2"></stop>
          </linearGradient>
          
          <linearGradient id="iri2" x1="1" y1="0" x2="0" y2="1.1">
            <stop offset="0%" stop-color="#A6EEFF"></stop>
            <stop offset="25%" stop-color="#FFBADC"></stop>
            <stop offset="50%" stop-color="#C5B0FF"></stop>
            <stop offset="75%" stop-color="#FFE694"></stop>
            <stop offset="100%" stop-color="#B6F4CA"></stop>
          </linearGradient>
          
          <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0"></stop>
            <stop offset="47%" stop-color="#FFFFFF" stop-opacity="0.55"></stop>
            <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"></stop>
            <stop offset="53%" stop-color="#FFFFFF" stop-opacity="0.55"></stop>
            <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </linearGradient>
          
          <radialGradient id="hi" cx="30%" cy="18%" r="45%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"></stop>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </radialGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"></stop>
            <stop offset="3%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#iri1)"></rect>
        
        <rect width="100%" height="100%" fill="url(#iri2)" style="mix-blend-mode: screen" opacity="0.85"></rect>
        <rect width="100%" height="100%" fill="url(#hi)"></rect>
        <rect width="100%" height="100%" fill="url(#sheen)"></rect>
        <rect width="100%" height="100%" fill="url(#rim)"></rect>
