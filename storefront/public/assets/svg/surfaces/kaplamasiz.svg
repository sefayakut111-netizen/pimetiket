<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <defs>
    <clipPath id="surface-clip">
      <rect x="0" y="0" width="220" height="110" rx="35" ry="35"></rect>
    </clipPath>
  </defs>
  <g clip-path="url(#surface-clip)">
<defs>
          <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F4EEDF"></stop>
            <stop offset="100%" stop-color="#E2D8BF"></stop>
          </linearGradient>
          
          <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="3" seed="9"></feTurbulence>
            <feColorMatrix values="0 0 0 0 0.40  0 0 0 0 0.32  0 0 0 0 0.20  0 0 0 0.50 0"></feColorMatrix>
            <feComposite in2="SourceGraphic" operator="in"></feComposite>
          </filter>
          
          <filter id="fiber">
            <feTurbulence type="fractalNoise" baseFrequency="0.05 2.5" numOctaves="2" seed="14"></feTurbulence>
            <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0.35 0"></feColorMatrix>
            <feComposite in2="SourceGraphic" operator="in"></feComposite>
          </filter>
          <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1">
            <stop offset="65%" stop-color="#3A2E18" stop-opacity="0"></stop>
            <stop offset="100%" stop-color="#3A2E18" stop-opacity="0.15"></stop>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#base)"></rect>
        <rect width="100%" height="100%" filter="url(#fiber)" opacity="0.5"></rect>
        <rect width="100%" height="100%" filter="url(#grain)" opacity="0.6"></rect>
        <rect width="100%" height="100%" fill="url(#bot)"></rect>
  </g>
</svg>