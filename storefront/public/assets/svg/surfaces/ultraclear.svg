<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <defs>
    <clipPath id="surface-clip">
      <rect x="0" y="0" width="220" height="110" rx="35" ry="35"></rect>
    </clipPath>
  </defs>
  <g clip-path="url(#surface-clip)">
<defs>
          
          <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#F3F7FC"></stop>
            <stop offset="50%" stop-color="#DDE7F1"></stop>
            <stop offset="100%" stop-color="#E8EDF3"></stop>
          </linearGradient>
          
          <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"></stop>
            <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.15"></stop>
            <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"></stop>
            <stop offset="100%" stop-color="#D6E4F3" stop-opacity="0.55"></stop>
          </linearGradient>
          
          <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"></stop>
            <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
            <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </linearGradient>
          
          <radialGradient id="pt1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"></stop>
            <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5"></stop>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </radialGradient>
          
          <radialGradient id="prism" cx="92%" cy="8%" r="35%">
            <stop offset="0%" stop-color="#C2D9F5" stop-opacity="0.55"></stop>
            <stop offset="100%" stop-color="#C2D9F5" stop-opacity="0"></stop>
          </radialGradient>
          
          <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
            <stop offset="2.5%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </linearGradient>
          <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1">
            <stop offset="78%" stop-color="#1F3A5C" stop-opacity="0"></stop>
            <stop offset="100%" stop-color="#1F3A5C" stop-opacity="0.22"></stop>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#base)"></rect>
        <rect width="100%" height="100%" fill="url(#prism)"></rect>
        <rect width="100%" height="100%" fill="url(#plane)"></rect>
        
        <g transform="translate(0, 8) rotate(-14)">
          <rect x="-15%" y="0" width="130%" height="9%" fill="url(#streak)" opacity="0.85"></rect>
        </g>
        
        <ellipse cx="78%" cy="34%" rx="6%" ry="2.5%" fill="url(#pt1)" opacity="0.9" transform="rotate(-12 200 100)"></ellipse>
        <ellipse cx="18%" cy="74%" rx="4%" ry="1.8%" fill="url(#pt1)" opacity="0.55"></ellipse>
        <rect width="100%" height="100%" fill="url(#bot)"></rect>
        
        <rect x="0.5" y="0.5" width="99.5%" height="99.5%" fill="none" stroke="#9BB6D2" stroke-opacity="0.5" stroke-width="1"></rect>
        <rect width="100%" height="100%" fill="url(#rim)"></rect>
  </g>
</svg>