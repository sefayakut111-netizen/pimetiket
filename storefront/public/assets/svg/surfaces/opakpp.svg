<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <defs>
    <clipPath id="surface-clip">
      <rect x="0" y="0" width="220" height="110" rx="35" ry="35"></rect>
    </clipPath>
  </defs>
  <g clip-path="url(#surface-clip)">
<defs>
          
          <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FBFCFE"></stop>
            <stop offset="30%" stop-color="#ECEEF3"></stop>
            <stop offset="55%" stop-color="#D7DAE1"></stop>
            <stop offset="80%" stop-color="#E2E5EB"></stop>
            <stop offset="100%" stop-color="#F1F3F7"></stop>
          </linearGradient>
          
          <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1.1">
            <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0"></stop>
            <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.55"></stop>
            <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.85"></stop>
            <stop offset="54%" stop-color="#FFFFFF" stop-opacity="0.55"></stop>
            <stop offset="78%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </linearGradient>
          
          <radialGradient id="spec" cx="22%" cy="18%" r="42%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
            <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.35"></stop>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </radialGradient>
          
          <radialGradient id="spec2" cx="80%" cy="78%" r="38%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"></stop>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </radialGradient>
          
          <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1">
            <stop offset="70%" stop-color="#1A1F2A" stop-opacity="0"></stop>
            <stop offset="100%" stop-color="#1A1F2A" stop-opacity="0.18"></stop>
          </linearGradient>
          
          <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"></stop>
            <stop offset="3%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#base)"></rect>
        <rect width="100%" height="100%" fill="url(#shine)"></rect>
        <rect width="100%" height="100%" fill="url(#spec)"></rect>
        <rect width="100%" height="100%" fill="url(#spec2)"></rect>
        <rect width="100%" height="100%" fill="url(#bot)"></rect>
        <rect width="100%" height="100%" fill="url(#rim)"></rect>
  </g>
</svg>