<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <defs>
    <clipPath id="surface-clip">
      <rect x="0" y="0" width="220" height="110" rx="35" ry="35"></rect>
    </clipPath>
  </defs>
  <g clip-path="url(#surface-clip)">
<defs>
          <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F4EEDF"></stop>
            <stop offset="100%" stop-color="#E2D8BF"></stop>
          </linearGradient>
          <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="9"></feTurbulence>
            <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.22  0 0 0 0.35 0"></feColorMatrix>
            <feComposite in2="SourceGraphic" operator="in"></feComposite>
          </filter>
          
          <radialGradient id="dome-hi" cx="28%" cy="22%" r="80%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"></stop>
            <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </radialGradient>
          <radialGradient id="dome-sh" cx="75%" cy="78%" r="65%">
            <stop offset="0%" stop-color="#3A2810" stop-opacity="0.45"></stop>
            <stop offset="80%" stop-color="#3A2810" stop-opacity="0"></stop>
          </radialGradient>
          
          <filter id="domesh" x="-15%" y="-15%" width="130%" height="130%">
            <feGaussianBlur stdDeviation="1.2"></feGaussianBlur>
          </filter>
        </defs>
        <rect width="100%" height="100%" fill="url(#base)"></rect>
        <rect width="100%" height="100%" filter="url(#grain)" opacity="0.55"></rect>
        
        <g>
          
          <ellipse cx="50%" cy="56%" rx="34%" ry="26%" fill="#3A2810" opacity="0.18" filter="url(#domesh)"></ellipse>
          
          <ellipse cx="50%" cy="50%" rx="34%" ry="26%" fill="url(#base)"></ellipse>
          <ellipse cx="50%" cy="50%" rx="34%" ry="26%" fill="url(#dome-hi)"></ellipse>
          <ellipse cx="50%" cy="50%" rx="34%" ry="26%" fill="url(#dome-sh)"></ellipse>
        </g>
  </g>
</svg>