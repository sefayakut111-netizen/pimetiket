<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Kare tabaka etiket — dikey A4 + 3×3 kare grid</title>
  <defs>
    <linearGradient id="tabaka-s-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1E6"/>
    </linearGradient>
    <linearGradient id="tabaka-s-sticker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8585"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
    <filter id="tabaka-s-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity="0.5" transform="rotate(-2 110 65)">
    <rect x="75" y="14" width="78" height="106" rx="3" fill="#F4F1E6" stroke="#1F1B2D" stroke-width="1.4"/>
  </g>

  <g filter="url(#tabaka-s-shadow)" transform="rotate(-4 110 65)">
    <rect x="70" y="10" width="80" height="110" rx="3" fill="url(#tabaka-s-paper)" stroke="#1F1B2D" stroke-width="2"/>

    <!-- 3 sütun × 3 satır = 9 kare, eşit aralıklı -->
    <g fill="url(#tabaka-s-sticker)" stroke="#1F1B2D" stroke-width="1.2">
      <rect x="80" y="22" width="18" height="18" rx="2"/><rect x="102" y="22" width="18" height="18" rx="2"/><rect x="124" y="22" width="18" height="18" rx="2"/>
      <rect x="80" y="50" width="18" height="18" rx="2"/><rect x="102" y="50" width="18" height="18" rx="2"/><rect x="124" y="50" width="18" height="18" rx="2"/>
      <rect x="80" y="78" width="18" height="18" rx="2"/><rect x="102" y="78" width="18" height="18" rx="2"/><rect x="124" y="78" width="18" height="18" rx="2"/>
    </g>
  </g>
</svg>
