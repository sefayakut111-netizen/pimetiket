<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Dikdörtgen rulo etiket — yatay dikdörtgen sticker</title>
  <defs>
    <linearGradient id="rulo-rt-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EDE3"/>
    </linearGradient>
    <linearGradient id="rulo-rt-sticker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f46d82"/>
      <stop offset="100%" stop-color="#ef3e56"/>
    </linearGradient>
    <filter id="rulo-rt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#rulo-rt-shadow)">
    <ellipse cx="65" cy="68" rx="48" ry="46" fill="url(#rulo-rt-body)" stroke="#141524" stroke-width="2"/>
    <ellipse cx="65" cy="68" rx="42" ry="40" fill="none" stroke="#141524" stroke-width="0.6" opacity="0.25"/>
    <ellipse cx="65" cy="68" rx="35" ry="33" fill="none" stroke="#141524" stroke-width="0.6" opacity="0.18"/>
    <ellipse cx="65" cy="68" rx="14" ry="13" fill="#F4F1E6" stroke="#141524" stroke-width="1.5"/>
    <ellipse cx="65" cy="68" rx="6" ry="5.5" fill="#141524" opacity="0.15"/>
    <path d="M 35 50 Q 50 45 70 46" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- 2 dikdörtgen sticker (stacked) -->
  <g filter="url(#rulo-rt-shadow)">
    <rect x="138" y="80" width="58" height="26" rx="2" fill="#f8b4be" stroke="#141524" stroke-width="1.5" opacity="0.6" transform="rotate(4 167 93)"/>
    <rect x="128" y="48" width="64" height="28" rx="2" fill="url(#rulo-rt-sticker)" stroke="#141524" stroke-width="1.8" transform="rotate(-3 160 62)"/>
    <rect x="134" y="54" width="16" height="6" rx="1" fill="#FFFFFF" opacity="0.4" transform="rotate(-3 142 57)"/>
  </g>
</svg>
