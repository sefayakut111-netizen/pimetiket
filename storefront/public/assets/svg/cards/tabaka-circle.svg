<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Yuvarlak tabaka etiket — A4 kağıt + daire grid</title>
  <defs>
    <linearGradient id="tabaka-c-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1E6"/>
    </linearGradient>
    <linearGradient id="tabaka-c-sticker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8585"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
    <filter id="tabaka-c-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Arkadaki ikinci kağıt (stacked feel) -->
  <g opacity="0.5" transform="rotate(-3 110 70)">
    <rect x="50" y="20" width="120" height="96" rx="3" fill="#F4F1E6" stroke="#1F1B2D" stroke-width="1.4"/>
  </g>

  <!-- Ön kağıt -->
  <g filter="url(#tabaka-c-shadow)" transform="rotate(-7 110 70)">
    <rect x="44" y="14" width="124" height="100" rx="3" fill="url(#tabaka-c-paper)" stroke="#1F1B2D" stroke-width="2"/>

    <!-- 3×4 = 12 daire -->
    <g fill="url(#tabaka-c-sticker)" stroke="#1F1B2D" stroke-width="1.2">
      <circle cx="68" cy="32" r="9"/><circle cx="106" cy="32" r="9"/><circle cx="144" cy="32" r="9"/>
      <circle cx="68" cy="56" r="9"/><circle cx="106" cy="56" r="9"/><circle cx="144" cy="56" r="9"/>
      <circle cx="68" cy="80" r="9"/><circle cx="106" cy="80" r="9"/><circle cx="144" cy="80" r="9"/>
      <circle cx="68" cy="104" r="9"/><circle cx="106" cy="104" r="9"/><circle cx="144" cy="104" r="9"/>
    </g>
  </g>
</svg>
