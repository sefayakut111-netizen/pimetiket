<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Yuvarlak tabaka etiket — dikey A4 + 3×4 daire grid</title>
  <defs>
    <linearGradient id="tabaka-c-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1E6"/>
    </linearGradient>
    <linearGradient id="tabaka-c-sticker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f46d82"/>
      <stop offset="100%" stop-color="#ef3e56"/>
    </linearGradient>
    <filter id="tabaka-c-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Arka kağıt (stacked effect, hafif kayık) -->
  <g opacity="0.5" transform="rotate(-2 110 65)">
    <rect x="75" y="14" width="78" height="106" rx="3" fill="#F4F1E6" stroke="#1F1B2D" stroke-width="1.4"/>
  </g>

  <!-- Ön kağıt — DİKEY, hafif rotation -->
  <g filter="url(#tabaka-c-shadow)" transform="rotate(-4 110 65)">
    <rect x="70" y="10" width="80" height="110" rx="3" fill="url(#tabaka-c-paper)" stroke="#1F1B2D" stroke-width="2"/>

    <!-- 3 sütun × 4 satır = 12 daire, eşit aralıklı -->
    <g fill="url(#tabaka-c-sticker)" stroke="#1F1B2D" stroke-width="1.2">
      <circle cx="86" cy="26" r="7"/><circle cx="110" cy="26" r="7"/><circle cx="134" cy="26" r="7"/>
      <circle cx="86" cy="50" r="7"/><circle cx="110" cy="50" r="7"/><circle cx="134" cy="50" r="7"/>
      <circle cx="86" cy="74" r="7"/><circle cx="110" cy="74" r="7"/><circle cx="134" cy="74" r="7"/>
      <circle cx="86" cy="98" r="7"/><circle cx="110" cy="98" r="7"/><circle cx="134" cy="98" r="7"/>
    </g>
  </g>
</svg>
