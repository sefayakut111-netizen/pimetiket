<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Özel kesim rulo etiket — kontur kesim sticker silüetleri</title>
  <defs>
    <linearGradient id="rulo-d-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EDE3"/>
    </linearGradient>
    <linearGradient id="rulo-d-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4D5"/>
    </linearGradient>
    <linearGradient id="rulo-d-sticker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8585"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
    <filter id="rulo-d-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#rulo-d-shadow)">
    <!-- Rulo silindir gövde (perspektif: yandan görünüm) -->
    <ellipse cx="65" cy="68" rx="48" ry="46" fill="url(#rulo-d-body)" stroke="#1F1B2D" stroke-width="2"/>
    <!-- Etiket malzeme katmanı (sarım çizgisi) -->
    <ellipse cx="65" cy="68" rx="42" ry="40" fill="none" stroke="#1F1B2D" stroke-width="0.6" opacity="0.25"/>
    <ellipse cx="65" cy="68" rx="35" ry="33" fill="none" stroke="#1F1B2D" stroke-width="0.6" opacity="0.18"/>
    <!-- Göbek -->
    <ellipse cx="65" cy="68" rx="14" ry="13" fill="#F4F1E6" stroke="#1F1B2D" stroke-width="1.5"/>
    <ellipse cx="65" cy="68" rx="6" ry="5.5" fill="#1F1B2D" opacity="0.15"/>
    <!-- Highlight (silindir parlama) -->
    <path d="M 35 50 Q 50 45 70 46" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- Sağ taraf — die-cut özel kesim sticker'lar (kontur dashed) -->
  <g filter="url(#rulo-d-shadow)">
    <!-- Arka katman (soluk) -->
    <path d="M 150 78 q 8 -12 22 -8 q 10 -6 18 4 q 14 -2 12 14 q 10 4 -2 16 q 4 14 -12 12 q -8 12 -20 -2 q -18 6 -16 -10 q -12 -10 -2 -18 q -4 -10 0 -8 z"
          fill="#FFB5A8" stroke="#1F1B2D" stroke-width="1.5" opacity="0.6"/>
    <!-- Ön katman (canlı) -->
    <path d="M 140 50 q 8 -12 22 -8 q 10 -6 18 4 q 14 -2 12 14 q 10 4 -2 16 q 4 14 -12 12 q -8 12 -20 -2 q -18 6 -16 -10 q -12 -10 -2 -18 q -4 -10 0 -8 z"
          fill="url(#rulo-d-sticker)" stroke="#1F1B2D" stroke-width="1.8"/>
    <!-- Kesim hattı (dashed) -->
    <path d="M 140 50 q 8 -12 22 -8 q 10 -6 18 4 q 14 -2 12 14 q 10 4 -2 16 q 4 14 -12 12 q -8 12 -20 -2 q -18 6 -16 -10 q -12 -10 -2 -18 q -4 -10 0 -8 z"
          fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 2" opacity="0.55"/>
  </g>
</svg>
