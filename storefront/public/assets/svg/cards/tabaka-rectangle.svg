<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Dikdörtgen tabaka etiket — A4 kağıt + dikdörtgen grid</title>
  <defs>
    <linearGradient id="tabaka-rt-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1E6"/>
    </linearGradient>
    <linearGradient id="tabaka-rt-sticker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8585"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
    <filter id="tabaka-rt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity="0.5" transform="rotate(-3 110 70)">
    <rect x="50" y="20" width="120" height="96" rx="3" fill="#F4F1E6" stroke="#1F1B2D" stroke-width="1.4"/>
  </g>

  <g filter="url(#tabaka-rt-shadow)" transform="rotate(-7 110 70)">
    <rect x="44" y="14" width="124" height="100" rx="3" fill="url(#tabaka-rt-paper)" stroke="#1F1B2D" stroke-width="2"/>

    <!-- 2×4 = 8 yatay dikdörtgen -->
    <g fill="url(#tabaka-rt-sticker)" stroke="#1F1B2D" stroke-width="1.2">
      <rect x="56" y="22" width="46" height="16" rx="2"/><rect x="110" y="22" width="46" height="16" rx="2"/>
      <rect x="56" y="46" width="46" height="16" rx="2"/><rect x="110" y="46" width="46" height="16" rx="2"/>
      <rect x="56" y="70" width="46" height="16" rx="2"/><rect x="110" y="70" width="46" height="16" rx="2"/>
      <rect x="56" y="94" width="46" height="16" rx="2"/><rect x="110" y="94" width="46" height="16" rx="2"/>
    </g>
  </g>
</svg>
