<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Dikdörtgen tabaka etiket — dikey A4 + 2×4 dikdörtgen grid</title>
  <defs>
    <linearGradient id="tabaka-rt-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1E6"/>
    </linearGradient>
    <linearGradient id="tabaka-rt-sticker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8585"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
    <filter id="tabaka-rt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity="0.5" transform="rotate(-2 110 65)">
    <rect x="75" y="14" width="78" height="106" rx="3" fill="#F4F1E6" stroke="#1F1B2D" stroke-width="1.4"/>
  </g>

  <g filter="url(#tabaka-rt-shadow)" transform="rotate(-4 110 65)">
    <rect x="70" y="10" width="80" height="110" rx="3" fill="url(#tabaka-rt-paper)" stroke="#1F1B2D" stroke-width="2"/>

    <!-- 2 sütun × 4 satır = 8 yatay dikdörtgen, eşit aralıklı -->
    <g fill="url(#tabaka-rt-sticker)" stroke="#1F1B2D" stroke-width="1.2">
      <rect x="79" y="22" width="24" height="12" rx="2"/><rect x="117" y="22" width="24" height="12" rx="2"/>
      <rect x="79" y="44" width="24" height="12" rx="2"/><rect x="117" y="44" width="24" height="12" rx="2"/>
      <rect x="79" y="66" width="24" height="12" rx="2"/><rect x="117" y="66" width="24" height="12" rx="2"/>
      <rect x="79" y="88" width="24" height="12" rx="2"/><rect x="117" y="88" width="24" height="12" rx="2"/>
    </g>
  </g>
</svg>
