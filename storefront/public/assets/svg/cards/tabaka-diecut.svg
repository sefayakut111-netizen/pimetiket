<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Özel kesim tabaka etiket — dikey A4 + Pim mascot silueti grid (2×3)</title>
  <defs>
    <linearGradient id="tabaka-d-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1E6"/>
    </linearGradient>
    <linearGradient id="tabaka-d-sticker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f46d82"/>
      <stop offset="100%" stop-color="#ef3e56"/>
    </linearGradient>
    <filter id="tabaka-d-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Pim mascot silueti — mevcut pim-etiket-mark-dark.svg'den alındı,
         scale + position için ayrı symbol. viewBox 158×120 → scale 0.14 = 22×17 -->
    <symbol id="pim-silhouette" viewBox="38 42 158 120" preserveAspectRatio="xMidYMid meet">
      <path d="M 38 110
           C 38 70, 70 42, 108 42
           C 138 42, 158 58, 162 84
           L 196 96
           L 162 104
           C 158 130, 138 148, 108 152
           C 96 158, 86 162, 78 158
           C 70 154, 70 144, 74 138
           C 56 132, 38 122, 38 110 Z" fill="currentColor"/>
      <!-- Göz: beyaz daire (sticker beyaz tabaka üstünde de okunur kalsın) -->
      <circle cx="118" cy="92" r="9" fill="#FFFFFF"/>
    </symbol>
  </defs>

  <!-- Arka kağıt -->
  <g opacity="0.5" transform="rotate(-2 110 65)">
    <rect x="75" y="14" width="78" height="106" rx="3" fill="#F4F1E6" stroke="#1F1B2D" stroke-width="1.4"/>
  </g>

  <!-- Ön kağıt — DİKEY -->
  <g filter="url(#tabaka-d-shadow)" transform="rotate(-4 110 65)">
    <rect x="70" y="10" width="80" height="110" rx="3" fill="url(#tabaka-d-paper)" stroke="#1F1B2D" stroke-width="2"/>

    <!-- 2 sütun × 3 satır = 6 Pim silueti
         Her Pim: 28×22 boyutta (use ile scale).
         Renk: brand mercan (#ef3e56).
         Dashed cut line: kontur kesim ipucu. -->
    <g color="#ef3e56">
      <use href="#pim-silhouette" x="78" y="20" width="28" height="22"/>
      <use href="#pim-silhouette" x="114" y="20" width="28" height="22"/>
      <use href="#pim-silhouette" x="78" y="52" width="28" height="22"/>
      <use href="#pim-silhouette" x="114" y="52" width="28" height="22"/>
      <use href="#pim-silhouette" x="78" y="84" width="28" height="22"/>
      <use href="#pim-silhouette" x="114" y="84" width="28" height="22"/>
    </g>
  </g>
</svg>
