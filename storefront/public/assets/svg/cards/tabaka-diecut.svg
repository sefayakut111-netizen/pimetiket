<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Özel kesim tabaka etiket — A4 kağıt + kontur kesim grid</title>
  <defs>
    <linearGradient id="tabaka-d-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F1E6"/>
    </linearGradient>
    <linearGradient id="tabaka-d-sticker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8585"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
    <filter id="tabaka-d-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity="0.5" transform="rotate(-3 110 70)">
    <rect x="50" y="20" width="120" height="96" rx="3" fill="#F4F1E6" stroke="#1F1B2D" stroke-width="1.4"/>
  </g>

  <g filter="url(#tabaka-d-shadow)" transform="rotate(-7 110 70)">
    <rect x="44" y="14" width="124" height="100" rx="3" fill="url(#tabaka-d-paper)" stroke="#1F1B2D" stroke-width="2"/>

    <!-- 2×3 = 6 die-cut silüet (blob) -->
    <g fill="url(#tabaka-d-sticker)" stroke="#1F1B2D" stroke-width="1.2">
      <path d="M 65 30 q 6 -10 16 -6 q 10 0 8 12 q 8 4 -2 12 q -4 10 -14 6 q -12 4 -10 -8 q -10 -4 -2 -12 q -4 -8 4 -4 z"/>
      <path d="M 125 30 q 6 -10 16 -6 q 10 0 8 12 q 8 4 -2 12 q -4 10 -14 6 q -12 4 -10 -8 q -10 -4 -2 -12 q -4 -8 4 -4 z"/>
      <path d="M 65 64 q 6 -10 16 -6 q 10 0 8 12 q 8 4 -2 12 q -4 10 -14 6 q -12 4 -10 -8 q -10 -4 -2 -12 q -4 -8 4 -4 z"/>
      <path d="M 125 64 q 6 -10 16 -6 q 10 0 8 12 q 8 4 -2 12 q -4 10 -14 6 q -12 4 -10 -8 q -10 -4 -2 -12 q -4 -8 4 -4 z"/>
      <path d="M 65 98 q 6 -10 16 -6 q 10 0 8 12 q 8 4 -2 12 q -4 10 -14 6 q -12 4 -10 -8 q -10 -4 -2 -12 q -4 -8 4 -4 z"/>
      <path d="M 125 98 q 6 -10 16 -6 q 10 0 8 12 q 8 4 -2 12 q -4 10 -14 6 q -12 4 -10 -8 q -10 -4 -2 -12 q -4 -8 4 -4 z"/>
    </g>
  </g>
</svg>
