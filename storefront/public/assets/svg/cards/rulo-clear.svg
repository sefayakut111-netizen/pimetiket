<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Şeffaf rulo etiket — transparan sticker</title>
  <defs>
    <linearGradient id="rulo-c-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EDE3"/>
    </linearGradient>
    <linearGradient id="rulo-c-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDEEFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A8CFEC" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="rulo-c-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#rulo-c-shadow)">
    <ellipse cx="65" cy="68" rx="48" ry="46" fill="url(#rulo-c-body)" stroke="#1F1B2D" stroke-width="2"/>
    <ellipse cx="65" cy="68" rx="42" ry="40" fill="none" stroke="#1F1B2D" stroke-width="0.6" opacity="0.25"/>
    <ellipse cx="65" cy="68" rx="35" ry="33" fill="none" stroke="#1F1B2D" stroke-width="0.6" opacity="0.18"/>
    <ellipse cx="65" cy="68" rx="14" ry="13" fill="#F4F1E6" stroke="#1F1B2D" stroke-width="1.5"/>
    <ellipse cx="65" cy="68" rx="6" ry="5.5" fill="#1F1B2D" opacity="0.15"/>
    <path d="M 35 50 Q 50 45 70 46" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- Şeffaf sticker (cam parlamasıyla) -->
  <g filter="url(#rulo-c-shadow)">
    <path d="M 142 50 q 6 -10 18 -7 q 8 -4 14 4 q 12 -1 9 12 q 8 4 -1 13 q 3 11 -10 9 q -6 10 -16 -2 q -14 4 -13 -8 q -10 -8 -2 -14 q -3 -8 1 -7 z"
          fill="url(#rulo-c-glass)" stroke="#1F1B2D" stroke-width="1.8"/>
    <!-- Cam parlama (highlight) -->
    <path d="M 150 56 q 4 -3 10 -2 q 3 1 4 4 q -1 3 -6 4 q -8 1 -8 -6 z"
          fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
